<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Brew Haven Coffee</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

```
<!-- Navigation -->

<header class="navbar">

    <div class="logo">
        Brew Haven
    </div>


    <nav>

        <a href="index.html">Home</a>
        <a href="index.html#menu">Menu</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>

    </nav>

</header>



<!-- Checkout -->

<main class="checkout-page">

    <div class="checkout-container">


        <!-- Customer Information -->

        <section class="checkout-form">

            <p class="small-heading">
                CHECKOUT
            </p>


            <h1>
                Complete Your Order
            </h1>


            <p class="checkout-intro">
                Please enter your details below to place your order.
            </p>


            <form id="checkout-form">

                <div class="form-group">

                    <label for="full-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="full-name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="08012345678"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>



                <div class="form-group">

                    <label for="address">
                        Delivery Address
                    </label>

                    <textarea
                        id="address"
                        rows="4"
                        placeholder="Enter your delivery address"
                        required
                    ></textarea>

                </div>



                <button type="submit" class="checkout-submit">
                    Place Order
                </button>

            </form>

        </section>



        <!-- Order Summary -->

        <section class="order-summary">

            <h2>
                Order Summary
            </h2>


            <div id="checkout-items">

                <p>
                    Your cart is empty.
                </p>

            </div>


            <div class="summary-total">

                <span>
                    Total
                </span>


                <strong id="checkout-total">
                    ₦0
                </strong>

            </div>

        </section>

    </div>

</main>



<!-- Footer -->

<footer>

    <p>
        © 2026 Brew Haven Coffee. All rights reserved.
    </p>

</footer>


<script src="checkout.js"></script>
```

</body>

</html>
